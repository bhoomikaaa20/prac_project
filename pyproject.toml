authors = [
    { name = "bhoomikaaa20", email = "bhoomikasomavarapu15@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain[huggingface]>=1.4.2",
    "langchain-openrouter>=0.2.9",
    "transformers>=5.17.0",
    "torch>=2.14.0",
